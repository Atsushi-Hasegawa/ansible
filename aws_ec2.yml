plugin: aws_ec2
regions:
  - ap-northeast-1
filters:
  instance-state-name:
    - running
hostnames:
  - tag:Name
  - public-ip-address
  - private-ip-address
keyed_groups:
  - key: tags.Name
    separator: ""
  - key: tags.Role
    prefix: role
  - key: tags.Group
    separator: ""
compose:
  ansible_host: public_ip_address
