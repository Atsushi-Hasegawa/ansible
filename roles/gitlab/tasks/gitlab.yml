---
- name: Install dependencies for GitLab
  yum:
    name:
      - curl
      - policycoreutils-python
      - openssh-server
      - postfix
    state: present

- name: Start and enable Postfix
  service:
    name: postfix
    state: started
    enabled: yes

- name: Add GitLab CE repository
  yum_repository:
    name: gitlab-ce
    description: GitLab CE repository
    baseurl: https://packages.gitlab.com/gitlab/gitlab-ce/el/{{ ansible_distribution_major_version }}/x86_64
    gpgcheck: yes
    gpgkey: https://packages.gitlab.com/gitlab/gitlab-ce/gpgkey
    enabled: yes

- name: Install GitLab CE
  yum:
    name: gitlab-ce
    state: present

- name: Configure GitLab
  command: gitlab-ctl reconfigure
  args:
    creates: /etc/gitlab/gitlab.rb
  notify: gitlab-ctl restart
